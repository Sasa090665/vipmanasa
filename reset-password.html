<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور - VIP Royal</title>
  
  <!-- خطوط جوجل (Cairo) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- مكتبة الأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- ملف التصميم الأساسي -->
  <link rel="stylesheet" href="signup.css"> <!-- أو reset-password.css لو مسميه باسم تاني -->
  
  <!-- تحميل مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="signup-container">
    <h2><i class="fas fa-unlock-alt"></i> كلمة مرور جديدة</h2>
    
    <form id="resetForm">
      <!-- خانة رمز التحقق -->
      <div class="input-group">
        <input type="text" id="verificationCode" placeholder="رمز التحقق (المرسل للإيميل)" required>
        <div class="error" id="codeError"></div>
      </div>
      
      <!-- خانة كلمة المرور الجديدة -->
      <div class="input-group">
        <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة" required>
        
        <!-- قائمة شروط كلمة المرور -->
        <div class="password-requirements" id="passwordRequirements">
          <p class="req-item" id="reqLength"><i class="fas fa-times-circle"></i> 8 أحرف على الأقل</p>
          <p class="req-item" id="reqUppercase"><i class="fas fa-times-circle"></i> حرف كبير واحد على الأقل (A-Z)</p>
          <p class="req-item" id="reqNumber"><i class="fas fa-times-circle"></i> رقم واحد على الأقل (0-9)</p>
          <p class="req-item" id="reqSpecial"><i class="fas fa-times-circle"></i> رمز خاص واحد على الأقل (@, #, $, !)</p>
        </div>
      </div>
      
      <!-- خانة تأكيد كلمة المرور -->
      <div class="input-group">
        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
        <div class="error" id="passwordError"></div>
      </div>
      
      <button type="submit">تغيير كلمة المرور</button>
    </form>
    
    <!-- رابط للعودة لصفحة تسجيل الدخول في حالة التراجع -->
    <p><a href="login.html">العودة لتسجيل الدخول</a></p>
  </div>
  
  <!-- ملف الجافاسكريبت الخاص بالصفحة -->
  <script src="reset-password.js"></script>
</body>
</html>
