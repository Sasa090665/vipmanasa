<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - VIP Royal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="signup.css">
  
  <!-- تحميل مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- تحميل مكتبة EmailJS لإرسال الإيميلات -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <div class="signup-container">
    <h2><i class="fas fa-right-to-bracket"></i> تسجيل الدخول</h2>
    
    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <div class="error" id="emailError"></div>
      </div>
      
      <div class="input-group">
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <div class="error" id="passwordError"></div>
      </div>

      <!-- رابط نسيت كلمة المرور -->
      <div style="margin-bottom: 15px; margin-top: -10px; text-align: left;">
        <a href="#" id="forgotPasswordBtn" style="font-size: 0.85rem; color: #3498db; text-decoration: none; font-weight: bold;">
          نسيت كلمة المرور؟
        </a>
      </div>

      <button type="submit">دخول</button>
    </form>
    
    <p>لسه معملتش حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
  </div>
  
  <script src="login.js"></script>
</body>
</html>
